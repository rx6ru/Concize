<!DOCTYPE html>
<html>
  <head>
    <title>Audio Recorder - Permission Request</title>
    <style>
      :root {
        --canvas: #faf9f5; --ink: #141413; --body: #3d3d3a;
        --muted: #6c6a64; --hairline: #e6dfd8;
        --primary: #cc785c; --primary-active: #a9583e;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: var(--canvas);
        color: var(--body);
      }
      .container {
        background: #fff;
        padding: 40px;
        border: 1px solid var(--hairline);
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(20, 20, 19, 0.06);
        text-align: center;
        max-width: 460px;
      }
      .container h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        font-size: 26px;
        letter-spacing: -0.3px;
        color: var(--ink);
        margin: 0 0 12px;
      }
      .container p { font-size: 15px; line-height: 1.6; color: var(--body); }
      .button {
        background-color: var(--primary);
        color: #fff;
        border: none;
        padding: 12px 22px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
        margin-top: 8px;
        transition: background 0.2s ease;
      }
      .button:hover { background-color: var(--primary-active); }
      #status { color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Microphone Permission Required</h1>
      <p>
        To record audio, this extension needs permission to use your microphone.
      </p>
      <button id="requestPermission" class="button">
        Allow Microphone Access
      </button>
      <p id="status"></p>
    </div>
    <script src="permission.js"></script>
  </body>
</html>
