<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concize</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <!-- Logo for the application -->
        <img src="images/Logo.png" alt="Concize Logo" class="logo">

        <!-- Auth: login form (shown when signed out) -->
        <div id="authSection" class="hidden">
            <input id="authEmail" class="auth-input" type="email" placeholder="Email" autocomplete="username">
            <input id="authPassword" class="auth-input" type="password" placeholder="Password" autocomplete="current-password">
            <div class="button-wrapper primary">
                <button id="signInButton" class="action-button visible">Sign In</button>
            </div>
            <div class="button-wrapper">
                <button id="signUpButton" class="action-button visible">Create Account</button>
            </div>
            <div id="authMessage" class="message-box"></div>
        </div>

        <!-- Signed-in account bar -->
        <div id="accountBar" class="hidden">
            <span id="accountEmail"></span>
            <button id="signOutButton">Sign out</button>
        </div>

        <!-- App (shown only when signed in) -->
        <div id="appSection" class="hidden">

        <!-- Worker status display -->
        <div class="status-wrapper">
            <span>Recording Status:</span>
            <span id="workerStatus" class="status-badge stopped">Stopped</span>
        </div>

        <!-- Recording controls section -->
        <div class="recording-controls">
            <!-- Recording indicator with blinking glyph -->
            <div id="recordingIndicator" class="recording-indicator hidden">
                <div id="recordingGlyph" class="recording-glyph blink"></div>
                <span>Recording...</span>
            </div>
            <!-- Button wrapper for start/stop buttons -->
            <div id="toggleButtonWrapper" class="button-wrapper start">
                <!-- Start Recording Button -->
                <button id="startRecord" class="action-button visible">
                    <svg id="startIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3" />
                    </svg>
                    Start Recording
                </button>
                <!-- Stop Recording Button -->
                <button id="stopRecord" class="action-button">
                    <svg id="stopIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                    </svg>
                    Stop Recording
                </button>
            </div>
        </div>

        <!-- Message boxes for status and permissions -->
        <div id="permissionStatus" class="message-box"></div>

        <!-- Chat button -->
        <div class="button-wrapper">
            <button id="openChat" class="action-button visible">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                Open Chat
            </button>
        </div>

        <!-- Get Transcription Button -->
        <div class="button-wrapper">
            <button id="getTranscriptionButton" class="action-button visible">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 17V3M6 11L12 17L18 11M19 21H5"/>
                </svg>
                Get Transcription
            </button>
        </div>

        <!-- Message boxes for status and permissions -->
        <div id="statusMessage" class="message-box"></div>

        <!-- Past meetings -->
        <div id="meetingListArea" class="transcription-box hidden">
            <h3>Your meetings</h3>
            <div id="meetingList"></div>
        </div>

        <!-- Transcription Display Area -->
        <div id="transcriptionDisplayArea" class="transcription-box hidden">
            <h3>Transcript</h3>
            <div id="transcriptTurns"></div>
        </div>

        <!-- Download Transcription Button -->
        <div class="button-wrapper hidden" id="downloadButtonWrapper">
            <button id="downloadTranscriptionButton" class="action-button visible">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download Transcription
            </button>
        </div>
        </div><!-- /#appSection -->
    </div>
    <!-- Config + auth must load before popup.js -->
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="live.render.js"></script>
    <script src="popup.js"></script>
</body>

</html>
