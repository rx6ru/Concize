<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concize Chat</title>
    <!-- Using marked.js library for proper Markdown rendering -->
    <!-- Reference the local file instead of the CDN to avoid CSP errors -->
    <script src="marked.min.js"></script>
    <link rel="stylesheet" href="chat-popup.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">Concize Assistant</div>
            <button class="close-button" id="closeButton">×</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
                <div class="empty-icon">💬</div>
                <div class="empty-title">Start a conversation</div>
                <div class="empty-subtitle">Ask me anything about your meeting</div>
            </div>
        </div>
        <button id="scrollToBottomBtn" class="scroll-to-bottom-btn hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M19 12l-7 7-7-7"/>
            </svg>
        </button>
        
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    class="input-field" 
                    id="messageInput" 
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton">
                    <svg class="send-icon" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z"/>
                    </svg>
                </button>
            </div>
            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </div>
    </div>

    <script src="chat-popup.js"></script>
</body>
</html>
